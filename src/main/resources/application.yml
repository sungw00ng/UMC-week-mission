spring:
  datasource:
    # DataGrip에서 사용하던 MySQL URL, DB 이름 확인
    url: jdbc:mysql://localhost:3306/database_week5?serverTimezone=Asia/Seoul
    username: root
    password: 558agers1
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 엔티티 기반으로 테이블 자동 생성/변경 (미션 진행 시 필수 설정)
      # create-drop을 유지하면 외래 키 경고가 발생할 수 있습니다.
      ddl-auto: update
    show-sql: true # 실행되는 SQL 쿼리를 콘솔에 출력
    properties:
      hibernate:
        format_sql: true # SQL 포맷을 보기 좋게 정렬
        # !!! 이 부분을 추가하여 MySQL 버전에 맞는 SQL 방언을 명시합니다. !!!
        # MySQL 8을 사용한다면 MySQL8Dialect를, 그 외에는 MySQLDialect를 사용할 수 있습니다.
        dialect: org.hibernate.dialect.MySQLDialect
