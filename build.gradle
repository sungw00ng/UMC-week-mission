plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.3'
    id 'io.spring.dependency-management' version '1.1.3'
}

group = 'org.example'
version = '1.0-SNAPSHOT'
sourceCompatibility = '17' // Java 버전에 맞춰 필요시 수정

repositories {
    mavenCentral()
}

dependencies {
    // =========================================================
    // 1. Spring Boot 핵심 및 유틸리티
    // =========================================================
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Java 8 Date/Time 지원 (LocalDateTime, LocalDate 사용 시 필요)
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // API 문서화 (Swagger)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // 실제 사용 DB: MySQL Connector J
    runtimeOnly 'com.mysql:mysql-connector-j'

    // =========================================================
    // 2. 개발 편의성 (Lombok)
    // =========================================================
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // =========================================================
    // 3. QueryDSL 설정 (OpenFeign 팀 Fork - 7.0)
    // =========================================================
    implementation "io.github.openfeign.querydsl:querydsl-jpa:7.0"
    implementation "io.github.openfeign.querydsl:querydsl-core:7.0"

    // APT (Annotation Processor Tool) 설정: Q클래스 생성을 위해 필요
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:7.0:jpa"
    // JPA 3.x (Jakarta Persistence) 스펙을 위한 의존성
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"

    // =========================================================
    // 4. 테스트 환경 (불필요한 중복 제거 및 정리 완료)
    // =========================================================
    // Spring Boot 테스트 핵심 (JUnit 5, Mockito, AssertJ, Spring Test 모두 포함)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Spring Security 테스트 지원 (MockMvc에서 Security Context 사용 가능)
    testImplementation 'org.springframework.security:spring-security-test'
    // 테스트 런타임 (JUnit Platform Launcher)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 테스트 코드 내 Lombok Annotation Processor 적용을 위함
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// Gradle이 테스트를 실행하는 방법을 설정
test {
    useJUnitPlatform()
}

// =========================================================
// ✨ QueryDSL Q클래스 생성 설정 (기존 내용 유지)
// =========================================================

// Q클래스가 생성될 디렉토리 경로 지정
def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

// 소스 세트에 생성 경로 추가: Q클래스가 컴파일러에게 인식되도록 함
sourceSets {
    main.java.srcDirs += [ querydslDir ]
}

// 컴파일 시 Q클래스가 위에서 지정한 디렉토리에 생성되도록 설정
tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory.set(querydslDir)
}

// clean 태스크 실행 시 generated/querydsl 폴더도 삭제하도록 설정 (선택 사항)
clean.doLast {
    file(querydslDir).deleteDir()
}
// =========================================================