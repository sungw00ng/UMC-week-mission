plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.3'
    id 'io.spring.dependency-management' version '1.1.3'
}

group = 'org.example'
version = '1.0-SNAPSHOT'
sourceCompatibility = '17' // Java 버전에 맞춰 필요시 수정

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 핵심
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 데이터베이스 및 JPA (DB 연동)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 보안 (인증/인가, JWT 처리)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 입력 값 유효성 검증
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Java 8 Date/Time 지원 (권장): LocalDateTime, LocalDate 사용 시 필요
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // 개발 편의성 (Lombok)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 실제 사용 DB: MySQL Connector J (H2 대신 MySQL로 교체)
    runtimeOnly 'com.mysql:mysql-connector-j'

    // =========================================================
    // ✨ QueryDSL 설정 (OpenFeign 팀 Fork - 7.0)
    // =========================================================
    implementation "io.github.openfeign.querydsl:querydsl-jpa:7.0"
    implementation "io.github.openfeign.querydsl:querydsl-core:7.0"

    // APT (Annotation Processor Tool) 설정: Q클래스 생성을 위해 필요
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:7.0:jpa"
    // JPA 3.x (Jakarta Persistence) 스펙을 위한 의존성 추가
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"

    // ✨ SpringDoc OpenAPI (Swagger 3.0) 의존성 추가
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0' // Spring Boot 3.x 버전
    // =========================================================

    // build.gradle 파일의 dependencies 블록에 추가
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 테스트 환경
    testImplementation 'org.springframework.boot:spring-boot-starter-test' // 스프링 테스트 환경
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Gradle이 테스트를 실행하는 방법을 설정
test {
    useJUnitPlatform()
}

// =========================================================
// ✨ QueryDSL Q클래스 생성 설정
// =========================================================

// Q클래스가 생성될 디렉토리 경로 지정 (프로젝트 빌드 폴더의 generated/querydsl)
def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

// 소스 세트에 생성 경로 추가: Q클래스가 컴파일러에게 인식되도록 함
sourceSets {
    main.java.srcDirs += [ querydslDir ]
}

// 컴파일 시 Q클래스가 위에서 지정한 디렉토리에 생성되도록 설정
tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory.set(querydslDir)
}

// clean 태스크 실행 시 generated/querydsl 폴더도 삭제하도록 설정 (선택 사항)
clean.doLast {
    file(querydslDir).deleteDir()
}
// =========================================================